<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bücher">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Meine Bücher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --paper:#f7f5f2; --paper-raised:#fffdf9; --ink:#1c1a16; --ink-dim:#65605a;
  --line:#e2ded4; --shelf:#16181d; --shelf-raised:#22252c; --shelf-line:#33373f;
  --shelf-ink:#fbfaf7; --shelf-ink-dim:#a8a29a; --brass:#b8862a; --brass-bright:#e8b13c;
  --good:#3f7d5c; --good-bg:#e4f0e7; --warn:#a3641f; --warn-bg:#f5e8d4; --bad:#a3402f; --bad-bg:#f5dfd9;
  --neutral-bg:#eeebe3; --shadow: 0 10px 30px -12px rgba(28,26,22,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131316; --paper-raised:#1b1c20; --ink:#f2efe9; --ink-dim:#a19b8e;
    --line:#2c2c30; --shelf:#0c0d10; --shelf-raised:#1a1c21; --shelf-line:#2c2f36;
    --neutral-bg:#232327;
  }
}
:root[data-theme="dark"]{
  --paper:#131316; --paper-raised:#1b1c20; --ink:#f2efe9; --ink-dim:#a19b8e;
  --line:#2c2c30; --shelf:#0c0d10; --shelf-raised:#1a1c21; --shelf-line:#2c2f36;
  --neutral-bg:#232327;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-family:'Zilla Slab',Georgia,serif;text-wrap:balance}
input,select,textarea,button{font-family:inherit}
::selection{background:var(--brass-bright);color:#1c1a16}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tnum{font-variant-numeric:tabular-nums}

.bar{background:var(--shelf);color:var(--shelf-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
.bar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--shelf-ink-dim);text-transform:uppercase}
.bar h1{font:600 22px/1.15 'Zilla Slab',serif;color:var(--shelf-ink);margin-top:3px}
.chip-value{flex:none;background:var(--shelf-raised);border:1px solid var(--shelf-line);border-radius:10px;padding:9px 12px;text-align:right;cursor:pointer}
.chip-value .eyebrow{color:var(--shelf-ink-dim)}
.chip-value .v{font:600 17px/1.2 'Zilla Slab',serif;color:var(--brass-bright);margin-top:3px}
.backbar{display:flex;align-items:center;gap:12px;background:var(--shelf);color:var(--shelf-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:var(--shelf-raised);border:1px solid var(--shelf-line);display:flex;align-items:center;justify-content:center;cursor:pointer;font:500 16px 'IBM Plex Mono',monospace;color:var(--shelf-ink);flex:none}
.backbar .title{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--shelf-ink-dim);text-transform:uppercase}
.backbar .title.center{flex:1;text-align:center}
.backbar .spacer{flex:1}
.linkbtn{font:500 13px/1 'IBM Plex Sans',sans-serif;color:var(--shelf-ink-dim);cursor:pointer;background:none;border:0;padding:8px}
.linkbtn.accent{color:var(--brass-bright)}
.hdrbtn{font:600 13px/1 'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:9px;padding:10px 16px;border:1px solid var(--shelf-line)}
.hdrbtn.ghost{background:var(--shelf-raised);color:var(--shelf-ink)}
.hdrbtn.accent{background:var(--brass-bright);color:#1c1a16;border-color:var(--brass-bright)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.section-title{padding:16px 18px 8px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}

.shelf-row{padding:0 14px 20px}
.shelf-label{padding:2px 6px 10px;font:600 13px/1.2 'Zilla Slab',serif;color:var(--ink)}
.shelf-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 6px 14px;scroll-snap-type:x proximity}
.spine-wrap{display:flex;flex-direction:column;gap:4px;flex:none;width:112px}
.spine-stars{text-align:center}
.spine{scroll-snap-align:start;flex:none;width:112px;min-height:152px;border-radius:5px 8px 8px 5px;position:relative;cursor:pointer;box-shadow:0 5px 12px -4px rgba(0,0,0,.35);overflow:hidden;background-size:cover;background-position:center}
.spine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:rgba(0,0,0,.28)}
.spine .inner{position:absolute;inset:0;padding:10px 9px 8px 15px;display:flex;flex-direction:column;gap:5px}
.spine .inner.shade{background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55) 70%)}
.spine .stripe{height:3px;border-radius:2px;background:rgba(255,255,255,.85);width:46%}
.spine .name{font:600 11px/1.18 'Zilla Slab',serif;color:#fff;text-wrap:pretty;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.spine .meta{margin-top:auto;font:500 8.5px/1.25 'IBM Plex Mono',monospace;letter-spacing:.03em;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.shelf-plank{height:9px;border-radius:2px;background:linear-gradient(#c9c1b4,#a89e8d);box-shadow:0 3px 6px rgba(0,0,0,.18);margin:0 6px}
.shelf-plank-shadow{height:5px;margin:0 15px;border-radius:0 0 3px 3px;background:#8f8676}

.list{padding:0 16px 20px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left}
.thumb{width:40px;height:52px;border-radius:4px;flex:none;background-size:cover;background-position:center;position:relative}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .title{font:600 14px/1.2 'Zilla Slab',serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font:400 11px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.badge{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.02em;padding:5px 7px;border-radius:6px;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.neutral{background:var(--neutral-bg);color:var(--ink-dim)}
.pages{font:600 12px/1 'IBM Plex Mono',monospace;color:var(--ink)}
.stars{color:var(--brass-bright);font-size:12px;letter-spacing:1px;white-space:nowrap}
.starsrow{display:flex;gap:6px}
.starbtn{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--brass-bright);padding:2px}
.empty{padding:40px 24px;text-align:center;font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}

.searchbar{display:flex;align-items:center;gap:9px;background:var(--shelf-raised);border:1px solid var(--shelf-line);border-radius:11px;padding:11px 13px}
.searchbar input{flex:1;background:transparent;border:0;outline:0;color:var(--shelf-ink);font:400 15px 'IBM Plex Sans',sans-serif}
.searchbar input::placeholder{color:var(--shelf-ink-dim)}
.searchbar .ico{font:400 14px 'IBM Plex Mono',monospace;color:var(--shelf-ink-dim)}
.chiprow{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.filterchip{flex:none;font:500 11px/1 'IBM Plex Sans',sans-serif;padding:8px 12px;border-radius:20px;border:1px solid var(--shelf-line);background:var(--shelf-raised);color:var(--shelf-ink-dim);cursor:pointer;white-space:nowrap}
.filterchip.active{background:var(--brass-bright);border-color:var(--brass-bright);color:#1c1a16}
.resultcount{padding:12px 16px 6px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:transparent;pointer-events:none;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.tabbar-inner{pointer-events:auto;max-width:480px;width:calc(100% - 24px);margin:0 12px;display:flex;background:var(--shelf);border:1px solid var(--shelf-line);border-radius:16px;box-shadow:var(--shadow);overflow:visible;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px 9px;cursor:pointer;color:var(--shelf-ink-dim);background:none;border:0}
.tab.active{color:var(--brass-bright)}
.tab .ic{font:400 18px/1 'IBM Plex Mono',monospace}
.tab .lb{font:500 9.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.02em}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:40}
.fabwrap-inner{max-width:480px;width:calc(100% - 24px);margin:0 12px;display:flex;justify-content:flex-end}
.fab{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--brass-bright),var(--brass));border:4px solid var(--paper);box-shadow:0 8px 18px -6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1c1a16;font:400 26px/1 'IBM Plex Sans',sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fab{border-color:var(--paper)} }
:root[data-theme="dark"] .fab{border-color:var(--paper)}

.detail-hero{padding:20px 16px 24px;background:var(--paper-raised)}
.detail-top{display:flex;gap:16px;align-items:flex-start}
.cover{width:88px;height:118px;border-radius:6px;flex:none;position:relative;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);background-size:cover;background-position:center}
.cover .inner{position:absolute;inset:0;padding:12px 10px;display:flex;flex-direction:column;gap:7px}
.cover .inner.shade{background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55) 70%)}
.cover .stripe{height:3px;border-radius:2px;background:rgba(255,255,255,.85);width:50%}
.cover .name{font:600 13px/1.15 'Zilla Slab',serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cover .pub{margin-top:auto;font:500 8.5px/1.2 'IBM Plex Mono',monospace;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.detail-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.detail-meta h2{font:600 20px/1.14 'Zilla Slab',serif;color:var(--ink)}
.detail-line{font:400 12.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.valuebox{margin-top:18px;background:var(--shelf);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.valuebox .lb{font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--shelf-ink-dim);text-transform:uppercase}
.valuebox .v{font:600 24px/1 'Zilla Slab',serif;color:var(--brass-bright)}
.rows{margin-top:18px;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:14px;padding:11px 13px;background:var(--paper-raised)}
.row .k{font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.row .v{font:500 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink);text-align:right}
.pcnote{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--neutral-bg);font:400 11.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.actions{margin-top:20px;display:flex;gap:10px}
.btn{flex:1;text-align:center;padding:14px;border-radius:11px;font:500 14px/1 'IBM Plex Sans',sans-serif;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--shelf);color:var(--shelf-ink)}
.btn.ghost{background:var(--paper-raised);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.form{padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field .lb{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=password],.field select,.field textarea{border:1px solid var(--line);background:var(--paper-raised);border-radius:9px;padding:11px 12px;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:56px}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{font:500 12px/1 'IBM Plex Sans',sans-serif;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);cursor:pointer}
.pill.active{background:var(--shelf);border-color:var(--shelf);color:var(--shelf-ink)}
.checkline{display:flex;align-items:center;gap:9px;cursor:pointer}
.checkline input{width:18px;height:18px}

.menu{padding:0 16px;display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;margin:0 0 20px}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:15px 15px;background:var(--paper-raised);border:1px solid var(--line);margin-top:-1px;cursor:pointer}
.menu-item .t{font:500 14px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink)}
.menu-item .s{font:400 11.5px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim);margin-top:2px}
.menu-item .arrow{font:400 15px 'IBM Plex Mono',monospace;color:var(--ink-dim)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.stat-tile{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.stat-tile .lb{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.stat-tile .v{margin-top:6px;font:600 22px/1 'Zilla Slab',serif;color:var(--ink)}
.stat-tile .v.accent{color:var(--brass-bright)}
.bars{padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.barline{display:flex;align-items:center;gap:10px}
.barline .lb{width:118px;flex:none;font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barline .track{flex:1;height:10px;border-radius:5px;background:var(--neutral-bg);overflow:hidden}
.barline .fill{height:100%;border-radius:5px;background:var(--brass-bright)}
.barline .n{width:30px;flex:none;text-align:right;font:500 11px/1 'IBM Plex Mono',monospace;color:var(--ink-dim)}

.sync-body{padding:18px 16px 100px;display:flex;flex-direction:column;gap:18px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sync-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:18px}
.sync-card h3{font:600 15px/1.3 'Zilla Slab',serif;color:var(--ink);margin-bottom:6px}
.sync-card p{margin:0;font:400 12.5px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.sync-meta{margin-top:12px;font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-dim)}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.sync-dot.ok{background:var(--good)}
.sync-dot.bad{background:var(--bad)}
.sync-dot.off{background:var(--ink-dim)}
.filepick{display:none}

.donate-card{margin:22px 16px 8px;padding:18px;border-radius:14px;background:var(--paper-raised);border:1px solid var(--line);text-align:center}
.donate-card p{margin:0 0 14px;font:400 12.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--shelf);color:var(--shelf-ink);border:1px solid var(--shelf-line);border-radius:12px;padding:13px 16px;font:400 13px/1.4 'IBM Plex Sans',sans-serif;box-shadow:var(--shadow);z-index:50;max-width:448px;margin:0 auto;text-align:center}
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.confirm-sheet{width:100%;max-width:480px;background:var(--paper);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto}
.confirm-sheet h3{font:600 17px/1.3 'Zilla Slab',serif;margin-bottom:8px}
.confirm-sheet p{font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim);margin:0 0 18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- desktop / wide-viewport layout ----------------
   Below this width the app is the single-column phone layout as-is.
   Above it: browse screens (Regal, Suche) widen into multi-column
   grids so the screen gets used; detail/edit/settings screens stay
   a comfortable, centered reading width instead of stretching form
   fields edge to edge. */
@media (min-width: 760px){
  .app{max-width:1180px}
  .bar{padding-left:32px;padding-right:32px}
  .backbar{padding-left:24px;padding-right:24px}
  .shelf-row{padding-left:26px;padding-right:26px}
  .shelf-scroll{flex-wrap:wrap;overflow-x:visible;scroll-snap-type:none}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-left:26px;padding-right:26px;gap:10px}
  .card{width:100%}

  .detail-hero,.form,.sync-body,.stat-grid,.bars,.menu,.empty{max-width:680px;margin-left:auto;margin-right:auto}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .tabbar-inner{max-width:560px}
  .fabwrap-inner{max-width:560px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

var SEED_BOOKS = [];

var CSV_HEADER = "Titel|Sprache|Ausgabe|Zustand|Notizen|Gelesen|Verlag|Jahr|Autor|ISBN|CoverBase64|CoverExt|Genre|Seiten|Bewertung";
var CSV_KEYS = ["titel","sprache","ausgabe","zustand","notizen","gelesen","verlag","jahr","autor","isbn","coverBase64","coverExt","genre","seiten","bewertung"];
var STORAGE_KEY = "buecher:books:v1";
var META_KEY = "buecher:meta:v1";
var NC_KEY = "buecher:nextcloud:v1";

function slug(s){ return String(s||"").trim().toLowerCase(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function parseSeiten(v){ var n = parseInt(String(v||"").replace(/[^0-9]/g,""),10); return isNaN(n) ? 0 : n; }
function parseBewertung(v){ var n = parseInt(v,10); return (n>=1 && n<=5) ? n : 0; }
function starsHtml(n, cls){ n = parseBewertung(n); var s=""; for(var i=1;i<=5;i++){ s += (i<=n?"★":"☆"); } return '<span class="'+(cls||"stars")+'">'+s+'</span>'; }
function loadMeta(){ try{ return JSON.parse(localStorage.getItem(META_KEY)) || {}; }catch(e){ return {}; } }
function saveMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function loadNC(){ try{ return JSON.parse(localStorage.getItem(NC_KEY)) || {}; }catch(e){ return {}; } }
function saveNC(m){ try{ localStorage.setItem(NC_KEY, JSON.stringify(m)); }catch(e){} }

/* ---------------- storage (IndexedDB) ----------------
   localStorage has a ~5-10MB per-origin quota; a real collection with
   embedded base64 cover images blows well past that. IndexedDB has a
   much larger quota and is built for exactly this. Books live there;
   small settings (meta/nextcloud) stay in localStorage. */
var IDB_NAME = "buecher-db";
var IDB_STORE = "kv";
var BOOKS_IDB_KEY = "books";
function idbOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error("IndexedDB nicht verfügbar")); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB konnte nicht geöffnet werden")); };
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, "readonly");
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbSet(key, value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function loadBooksAsync(){
  return idbGet(BOOKS_IDB_KEY).then(function(arr){
    if(Array.isArray(arr) && arr.length) return arr;
    /* one-time migration from an old localStorage-based store, in case
       an earlier version of this page ever used it on this device */
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var old = JSON.parse(raw);
        if(Array.isArray(old) && old.length){
          return idbSet(BOOKS_IDB_KEY, old).then(function(){
            localStorage.removeItem(STORAGE_KEY);
            return old;
          });
        }
      }
    }catch(e){}
    return SEED_BOOKS.slice();
  }).catch(function(){ return SEED_BOOKS.slice(); });
}
function persistBooks(){

  scheduleAutoPush();
}
function persistBooksNoPush(){

}

/* ---------------- CSV ---------------- */
function parseCSV(text){
  var lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(function(l){ return l.trim() !== ""; });
  if(!lines.length) return [];
  var start = /^Titel\|/.test(lines[0]) ? 1 : 0;
  var out = [];
  for(var i=start;i<lines.length;i++){
    var parts = lines[i].split("|");
    var b = {};
    for(var k=0;k<CSV_KEYS.length;k++){ b[CSV_KEYS[k]] = parts[k] !== undefined ? parts[k] : ""; }
    if(b.titel.trim() === "") continue;
    out.push(b);
  }
  return out;
}
function toCSV(books){
  var lines = [CSV_HEADER];
  books.forEach(function(b){
    lines.push(CSV_KEYS.map(function(k){ return (b[k]==null?"":String(b[k])).replace(/[\r\n]/g," "); }).join("|"));
  });
  return lines.join("\r\n") + "\r\n";
}

function zustandClass(z){
  z = (z||"").toLowerCase();
  if(z.indexOf("neu") === 0) return "good";
  if(z.indexOf("sehr gut") === 0) return "good";
  if(z.indexOf("gut") === 0) return "warn";
  if(z === "") return "neutral";
  return "warn";
}
var GENRE_PALETTE = ["#3a6ea5","#8a4f7d","#3f7d5c","#a3641f","#5a5aa0","#9a4a4a","#3f8a8a","#7a6a3a"];
function genreColor(genre){
  var s = genre || "Sonstige";
  var h = 0;
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return GENRE_PALETTE[h % GENRE_PALETTE.length];
}
function shade(hex, amt){
  var c = hex.replace("#","");
  var num = parseInt(c,16);
  var r = Math.min(255,Math.max(0,(num>>16)+amt));
  var g = Math.min(255,Math.max(0,((num>>8)&0xff)+amt));
  var b = Math.min(255,Math.max(0,(num&0xff)+amt));
  return "rgb("+r+","+g+","+b+")";
}
function coverMime(ext){
  ext = (ext||"").replace(".","").toLowerCase();
  if(ext==="jpg"||ext==="jpeg") return "image/jpeg";
  if(ext==="png") return "image/png";
  if(ext==="webp") return "image/webp";
  if(ext==="gif") return "image/gif";
  return "image/jpeg";
}
function hasCover(b){ return !!(b && b.coverBase64); }
function coverBgStyle(b){
  if(hasCover(b)) return "background-image:url('data:"+coverMime(b.coverExt)+";base64,"+b.coverBase64+"')";
  var color = genreColor(b && b.genre);
  return "background:linear-gradient(160deg,"+color+","+shade(color,-25)+")";
}

/* ---------------- Nextcloud WebDAV sync ---------------- */
var pushTimer = null;
function scheduleAutoPush(){
  var nc = loadNC();
  var gd = loadGDrive();
  if(!nc.url && !gd.fileId) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){
    if(nc.url){ pushToNextcloud(); }
    if(gd.fileId){ pushToGDrive().catch(function(){}); }
  }, 1500);
}
function ncAuthHeader(nc){ return "Basic " + btoa(unescape(encodeURIComponent((nc.user||"")+":"+(nc.pass||"")))); }

function pushToNextcloud(){
  var nc = loadNC();
  if(!nc.url) return Promise.resolve();
  var csv = toCSV(state.books);
  return fetch(nc.url, {
    method: "PUT",
    headers: { "Authorization": ncAuthHeader(nc), "Content-Type": "text/csv" },
    body: csv
  }).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    var meta = loadMeta();
    meta.ncLastPush = Date.now();
    meta.ncLastSyncedHash = normalizedBooksHash(state.books);
    meta.ncLastError = null;
    saveMeta(meta);
    if(state.view === "sync") render();
  }).catch(function(err){
    var meta = loadMeta();
    meta.ncLastError = "Push fehlgeschlagen: " + err.message + " (evtl. CORS/Zugangsdaten prüfen)";
    saveMeta(meta);
    if(state.view === "sync") render();
  });
}

function hashStr(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}
/* Hash over the parsed, sorted book data instead of the raw CSV text:
   two devices don't necessarily write byte-identical files (line
   endings, order). Sorted by title so a pure re-ordering doesn't
   trigger a false "differs" alarm either. */
function normalizedBooksHash(books){
  var lines = books.map(function(b){
    return CSV_KEYS.map(function(k){ return b[k]==null?"":String(b[k]); }).join("|");
  }).sort();
  return hashStr(lines.join("\n"));
}

function pullFromNextcloud(silent){
  var nc = loadNC();
  if(!nc.url) return Promise.resolve();
  return fetch(nc.url, { headers: { "Authorization": ncAuthHeader(nc) }, cache: "no-store" })
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function(text){
      var meta = loadMeta();
      meta.ncLastPull = Date.now();
      meta.ncLastError = null;
      saveMeta(meta);
      var parsed = parseCSV(text);
      if(!parsed.length){ if(!silent) showToast("Remote-Datei leer oder unlesbar."); return; }
      var remoteHash = normalizedBooksHash(parsed);
      if(remoteHash === meta.ncLastSyncedHash){ if(!silent){ showToast("Bereits aktuell."); } return; }
      state.confirm = {
        title: "Neue Version auf Nextcloud",
        msg: "Die Datei auf Nextcloud unterscheidet sich (" + parsed.length + " Bücher). Übernehmen und die " + state.books.length + " Bücher hier ersetzen?",
        okLabel: "Übernehmen",
        onOk: function(){
          state.books = parsed;
          persistBooksNoPush();
          var m = loadMeta(); m.ncLastSyncedHash = remoteHash; saveMeta(m);
          go("regal");
          showToast("Von Nextcloud übernommen: " + parsed.length + " Bücher.");
        }
      };
      render();
    })
    .catch(function(err){
      var meta = loadMeta();
      meta.ncLastError = "Abruf fehlgeschlagen: " + err.message + " (evtl. CORS/Zugangsdaten prüfen)";
      saveMeta(meta);
      if(!silent) showToast(meta.ncLastError);
      if(state.view === "sync") render();
    });
}
/* ---------------- Google Drive sync ----------------
   Google Drive has no WebDAV/Basic-Auth endpoint, so this is a
   separate path: OAuth (Google Identity Services token flow) instead
   of a static app password, and the Drive REST API instead of PUT/GET
   on a plain URL. The OAuth Client ID is the user's own - they must
   create it themselves in Google Cloud Console, and it lives in
   localStorage like the Nextcloud settings do. The access token itself
   is kept in memory only (not persisted) and requires a real user
   gesture (the "Mit Google verbinden" click) to obtain, so background
   pushes only work while that token is still valid. */
var GDRIVE_KEY = "buecher:gdrive:v1";
function loadGDrive(){ try{ return JSON.parse(localStorage.getItem(GDRIVE_KEY)) || {}; }catch(e){ return {}; } }
function saveGDrive(m){ try{ localStorage.setItem(GDRIVE_KEY, JSON.stringify(m)); }catch(e){} }

var gdriveAccessToken = null;
var gdriveTokenExpiry = 0;
function gdriveConnect(){
  var gd = loadGDrive();
  if(!gd.clientId) return Promise.reject(new Error("Bitte zuerst deine Google-Client-ID eintragen und speichern."));
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    return Promise.reject(new Error("Google-Anmeldung konnte nicht geladen werden (kein Internet beim Laden der Seite?)."));
  }
  return new Promise(function(resolve, reject){
    try{
      var client = google.accounts.oauth2.initTokenClient({
        client_id: gd.clientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: function(resp){
          if(resp && resp.access_token){
            gdriveAccessToken = resp.access_token;
            gdriveTokenExpiry = Date.now() + (resp.expires_in || 3600) * 1000;
            resolve(gdriveAccessToken);
          } else {
            reject(new Error("Google-Anmeldung abgebrochen oder fehlgeschlagen."));
          }
        },
        error_callback: function(err){ reject(new Error("Google-Anmeldung fehlgeschlagen: " + (err && err.type ? err.type : "unbekannter Fehler"))); }
      });
      client.requestAccessToken();
    }catch(e){ reject(e); }
  });
}
function gdriveToken(){
  if(gdriveAccessToken && Date.now() < gdriveTokenExpiry - 30000) return Promise.resolve(gdriveAccessToken);
  return Promise.reject(new Error("Nicht mit Google verbunden (oder Anmeldung abgelaufen) – bitte „Mit Google verbinden“ antippen."));
}
function gdriveCreateFile(){
  return gdriveToken().then(function(token){
    var boundary = "buechersep";
    var metadata = JSON.stringify({ name: "buecher.csv", mimeType: "text/csv" });
    var body = "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+metadata+
      "\r\n--"+boundary+"\r\nContent-Type: text/csv\r\n\r\n"+toCSV(state.books)+
      "\r\n--"+boundary+"--";
    return fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { "Authorization": "Bearer "+token, "Content-Type": "multipart/related; boundary="+boundary },
      body: body
    });
  }).then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }).then(function(data){
    var gd = loadGDrive(); gd.fileId = data.id; saveGDrive(gd);
    return data.id;
  });
}
function pullFromGDrive(silent){
  var gd = loadGDrive();
  if(!gd.fileId) return Promise.resolve();
  return gdriveToken().then(function(token){
    return fetch("https://www.googleapis.com/drive/v3/files/"+gd.fileId+"?alt=media", { headers: { "Authorization": "Bearer "+token }, cache: "no-store" });
  }).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);

  }).then(function(text){
    var meta = loadMeta();

    meta.gdLastError = null;

    if(!parsed.length){ if(!silent) showToast("Remote-Datei leer oder unlesbar."); return; }
    var remoteHash = normalizedBooksHash(parsed);
    if(remoteHash === meta.gdLastSyncedHash){ if(!silent){ showToast("Bereits aktuell."); } return; }
    state.confirm = {
      title: "Neue Version auf Google Drive",
      msg: "Die Datei auf Google Drive unterscheidet sich (" + parsed.length + " Bücher). Übernehmen und die " + state.books.length + " Bücher hier ersetzen?",
      okLabel: "Übernehmen",
      onOk: function(){
        state.books = parsed;
        persistBooksNoPush();
        var m = loadMeta(); m.gdLastSyncedHash = remoteHash; saveMeta(m);
        go("regal");
        showToast("Von Google Drive übernommen: " + parsed.length + " Bücher.");
      }
    };
    render();
  }).catch(function(err){
    var meta = loadMeta();
    meta.gdLastError = "Abruf (Google Drive) fehlgeschlagen: " + err.message;
    saveMeta(meta);
    if(!silent) showToast(meta.gdLastError);
    if(state.view === "sync") render();
  });
}
function pushToGDrive(){
  var gd = loadGDrive();
  if(!gd.fileId) return Promise.resolve();

    return fetch("https://www.googleapis.com/upload/drive/v3/files/"+gd.fileId+"?uploadType=media", {

  }).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    var meta = loadMeta();
    meta.gdLastPush = Date.now();

    var meta = loadMeta();
    meta.gdLastError = "Push (Google Drive) fehlgeschlagen: " + err.message;

    if(state.view === "sync") render();
  });
}

/* ---------------- Buchsuche: Google Books + Open Library als Fallback ----------------
   Ersetzt den RAWG/IGDB-Abgleich der PC-Spielesammlung: liefert
   Titel/Autor/Verlag/Jahr/ISBN/Seitenzahl UND ein Cover, ganz ohne
   eigenen API-Key. Google Books hat ohne Schlüssel ein ziemlich
   knappes anonymes Rate-Limit (HTTP 429, teilt sich alle Nutzer ohne
   Key) - schlägt der Abruf fehl, wird automatisch bei Open Library
   nachgeschaut (grosszügigeres Limit, ebenfalls kein Key nötig). */
function googleBooksFetch(query){
  var url = "https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(query) + "&maxResults=1";
  return fetch(url).then(function(r){ if(!r.ok) throw new Error("Google Books: HTTP "+r.status); return r.json(); })
    .then(function(data){
      var item = data.items && data.items[0];
      if(!item) throw new Error("Kein Treffer bei Google Books.");
      var info = item.volumeInfo || {};
      var ident = info.industryIdentifiers || [];
      var isbn13 = ident.filter(function(x){ return x.type==="ISBN_13"; })[0];
      var isbn10 = ident.filter(function(x){ return x.type==="ISBN_10"; })[0];
      var res = {
        titel: info.title || "",
        autor: (info.authors||[]).join(" / "),
        verlag: info.publisher || "",
        jahr: info.publishedDate ? String(info.publishedDate).slice(0,4) : "",
        isbn: isbn13 ? isbn13.identifier : (isbn10 ? isbn10.identifier : ""),
        seiten: info.pageCount ? String(info.pageCount) : "",
        coverURL: ""
      };
      var img = info.imageLinks;
      if(img){ res.coverURL = (img.thumbnail || img.smallThumbnail || "").replace("http://","https://"); }
      return res;
    });
}
function googleBooksFetchByTitle(titel, autor){
  var q = "intitle:" + titel + (autor ? "+inauthor:"+autor : "");
  return googleBooksFetch(q);
}
function googleBooksFetchByIsbn(isbn){
  return googleBooksFetch("isbn:"+isbn);
}
function urlToBase64(url){
  return fetch(url).then(function(r){ if(!r.ok) throw new Error("Bild-Download: HTTP "+r.status); return r.blob(); })
    .then(function(blob){
      return new Promise(function(resolve,reject){
        var reader = new FileReader();
        reader.onload = function(){ resolve(String(reader.result).split(",")[1] || ""); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
}

function openLibrarySearch(query){
  var url = "https://openlibrary.org/search.json?q=" + encodeURIComponent(query) + "&limit=1&fields=title,author_name,first_publish_year,publisher,number_of_pages_median,isbn,cover_i";
  return fetch(url).then(function(r){ if(!r.ok) throw new Error("Open Library: HTTP "+r.status); return r.json(); })
    .then(function(data){
      var doc = data.docs && data.docs[0];
      if(!doc) throw new Error("Kein Treffer bei Open Library.");
      var isbn = (doc.isbn && doc.isbn[0]) || "";
      return {
        titel: doc.title || "",
        autor: (doc.author_name||[]).join(" / "),
        verlag: (doc.publisher||[])[0] || "",
        jahr: doc.first_publish_year ? String(doc.first_publish_year) : "",
        isbn: isbn,
        seiten: doc.number_of_pages_median ? String(doc.number_of_pages_median) : "",
        coverURL: doc.cover_i ? ("https://covers.openlibrary.org/b/id/"+doc.cover_i+"-L.jpg") : (isbn ? ("https://covers.openlibrary.org/b/isbn/"+isbn+"-L.jpg") : "")
      };
    });
}
function openLibraryByIsbn(isbn){
  var url = "https://openlibrary.org/api/books?bibkeys=" + encodeURIComponent("ISBN:"+isbn) + "&format=json&jscmd=data";
  return fetch(url).then(function(r){ if(!r.ok) throw new Error("Open Library: HTTP "+r.status); return r.json(); })
    .then(function(data){
      var d = data["ISBN:"+isbn];
      if(!d) throw new Error("Kein Treffer bei Open Library.");
      var cover = d.cover || {};
      return {
        titel: d.title || "",
        autor: (d.authors||[]).map(function(a){ return a.name; }).join(" / "),
        verlag: (d.publishers||[]).map(function(p){ return p.name; })[0] || "",
        jahr: d.publish_date ? String(d.publish_date).slice(-4) : "",
        isbn: isbn,
        seiten: d.number_of_pages ? String(d.number_of_pages) : "",
        coverURL: cover.large || cover.medium || cover.small || ""
      };
    });
}
function bookLookupByTitle(titel, autor){
  return googleBooksFetchByTitle(titel, autor).catch(function(gErr){
    return openLibrarySearch(titel + (autor ? " " + autor : "")).catch(function(oErr){
      throw new Error("Google Books: " + gErr.message + " · Open Library: " + oErr.message);
    });
  });
}
function bookLookupByIsbn(isbn){
  return googleBooksFetchByIsbn(isbn).catch(function(gErr){
    return openLibraryByIsbn(isbn).catch(function(oErr){
      throw new Error("Google Books: " + gErr.message + " · Open Library: " + oErr.message);
    });
  });
}

/* downscale + compress a captured photo to keep storage lean */
function fileToCompressedBase64(file, maxDim){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      var scale = Math.min(1, (maxDim||900) / Math.max(w,h));
      var cw = Math.round(w*scale), ch = Math.round(h*scale);
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(img,0,0,cw,ch);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      resolve(dataUrl.split(",")[1] || "");
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ---------------- barcode scanner (ZXing, from a still photo) ----------------
   Live in-page camera access (getUserMedia) needs its own permission that,
   on a Home Screen shortcut / installed PWA, is a SEPARATE grant from the
   browser app's own camera permission - the OS can treat the shortcut as a
   distinct app/package. That's outside our control. The native camera
   picker behind <input type=file capture> sidesteps this entirely (it's
   the OS's own camera app handing back a photo, not in-page video), which
   is exactly why "Buchcover abfotografieren" already works everywhere. So
   the scanner decodes a barcode from a captured photo instead of a live
   feed. */
function decodeBarcodeFromFile(file){
  if(!window.ZXing){ return Promise.reject(new Error("Scanner-Bibliothek konnte nicht geladen werden (kein Internet beim Laden der Seite?).")); }
  var decodePromise = new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var zxingReader = new ZXing.BrowserMultiFormatReader();
      zxingReader.decodeFromImageUrl(String(reader.result))
        .then(function(result){ resolve(result.getText()); })
        .catch(function(){ reject(new Error("Kein Barcode im Foto erkannt. Näher heran, gerade halten und erneut versuchen.")); });
    };
    reader.onerror = function(){ reject(new Error("Foto konnte nicht gelesen werden.")); };
    reader.readAsDataURL(file);
  });
  /* A recognized-but-unreadable pattern (bad angle/blur) makes the
     library retry with no attempt limit or timeout of its own, which
     would otherwise leave the "Erkenne…" state stuck forever. */
  var timeout = new Promise(function(_, reject){
    setTimeout(function(){ reject(new Error("Kein Barcode im Foto erkannt (Zeitüberschreitung). Näher heran, gerade halten und erneut versuchen.")); }, 8000);
  });
  return Promise.race([decodePromise, timeout]);
}

  {id:"titel", lb:"Titel A–Z"},

  {id:"seiten_desc", lb:"Seiten ↓"},
  {id:"jahr", lb:"Jahr"},

function sortBooks(list, sortBy){
  var out = list.slice();
  switch(sortBy){
    case "seiten_asc": out.sort(function(a,b){ return parseSeiten(a.seiten)-parseSeiten(b.seiten) || a.titel.localeCompare(b.titel,"de"); }); break;
    case "seiten_desc": out.sort(function(a,b){ return parseSeiten(b.seiten)-parseSeiten(a.seiten) || a.titel.localeCompare(b.titel,"de"); }); break;
    case "jahr": out.sort(function(a,b){ return (parseInt(a.jahr,10)||9999)-(parseInt(b.jahr,10)||9999) || a.titel.localeCompare(b.titel,"de"); }); break;
    case "autor": out.sort(function(a,b){ return (a.autor||"").localeCompare(b.autor||"","de") || a.titel.localeCompare(b.titel,"de"); }); break;
    default: out.sort(function(a,b){ return a.titel.localeCompare(b.titel,"de"); });
  }
  return out;
}

function viewStats(){
  var books = state.books;
  var total = books.length, sumSeiten = totalSeiten(), avgSeiten = total ? Math.round(sumSeiten/total) : 0;
  var ratedBooks = books.filter(function(b){ return parseBewertung(b.bewertung) > 0; });
  var avgRating = ratedBooks.length ? (ratedBooks.reduce(function(a,b){ return a+parseBewertung(b.bewertung); },0) / ratedBooks.length) : 0;
  var years = books.map(function(b){ return parseInt(b.jahr,10); }).filter(function(y){ return y && !isNaN(y); });
  var yrRange = years.length ? (Math.min.apply(null,years)+" – "+Math.max.apply(null,years)) : "—";

    var m = {};
    books.forEach(function(b){ var v = (b[field]||"").trim() || "Unbekannt"; m[v] = (m[v]||0)+1; });

  }
  function barsHtml(pairs, limit){

    return top.map(function(p){
      var pct = Math.round((p[1]/max)*100);

    }).join('');

    '<div class="stat-tile"><div class="lb">Ø Bewertung</div><div class="v accent tnum">'+(avgRating?avgRating.toFixed(1)+' ★':'—')+'</div></div>'+
  '</div>';
  html += '<div class="stat-grid" style="grid-template-columns:1fr">'+
    '<div class="stat-tile"><div class="lb">Jahresspanne</div><div class="v tnum" style="font-size:17px">'+yrRange+'</div></div>'+
  '</div>';
  html += '<div class="section-title">Zustand</div><div class="bars">'+barsHtml(counts("zustand"),6)+'</div>';

    case "sync": html = viewSync(); break;
    case "edit": html = viewEdit(); break;
    default: html = viewRegal();
  }
  root.innerHTML = html;

  var toastHost = document.getElementById("toastHost");
  toastHost.innerHTML = state.toast ? '<div class="toast">'+esc(state.toast)+'</div>' : "";
  if(state.confirm){
    toastHost.innerHTML += '<div class="confirm-backdrop" id="confirmBackdrop"><div class="confirm-sheet">'+
      '<h3>'+esc(state.confirm.title)+'</h3><p>'+esc(state.confirm.msg)+'</p>'+
      '<div class="actions"><button class="btn ghost" id="confirmCancel">Abbrechen</button><button class="btn primary" id="confirmOk">'+esc(state.confirm.okLabel||"OK")+'</button></div>'+
    '</div></div>';
  }
  wireEvents(root);
  wireToastEvents();
}
function wireToastEvents(){
  var cancel = document.getElementById("confirmCancel");
  var ok = document.getElementById("confirmOk");
  if(cancel) cancel.onclick = function(){ state.confirm = null; render(); };
  if(ok) ok.onclick = function(){ var fn = state.confirm && state.confirm.onOk; state.confirm = null; if(fn) fn(); render(); };
}

function wireEvents(root){
  root.querySelectorAll("[data-tab]").forEach(function(el){
    el.addEventListener("click", function(){ go(el.getAttribute("data-tab")); });
  });
  root.querySelectorAll("[data-canceledit]").forEach(function(el){
    el.addEventListener("click", function(){
      state.addFlow = null; state.matchResult = null;
      go("regal");
    });
  });
  root.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click", function(){
      var titel = el.getAttribute("data-edit");
      var idx = findIndex(titel);
      go("edit", { editing: titel, addFlow: Object.assign({}, idx>=0 ? state.books[idx] : BLANK_BOOK), matchResult: null });
    });
  });
  root.querySelectorAll("[data-newbook]").forEach(function(el){ el.addEventListener("click", function(){ go("edit", {editing:null, addFlow: Object.assign({}, BLANK_BOOK), matchResult:null}); }); });
  root.querySelectorAll("[data-delete]").forEach(function(el){
    el.addEventListener("click", function(){
      var titel = el.getAttribute("data-delete");
      state.confirm = { title:"Buch löschen?", msg:'"'+titel+'" wird endgültig entfernt.', okLabel:"Löschen",
        onOk:function(){ var idx=findIndex(titel); if(idx>=0){ state.books.splice(idx,1); persistBooks(); } go("search"); showToast("Gelöscht."); } };
      render();
    });
  });
  root.querySelectorAll("[data-sort]").forEach(function(el){ el.addEventListener("click", function(){ state.sortBy = el.getAttribute("data-sort"); render(); }); });
  root.querySelectorAll("[data-ausgabe]").forEach(function(el){ el.addEventListener("click", function(){ var v=el.getAttribute("data-ausgabe"); state.filterAusgabe = state.filterAusgabe===v?null:v; render(); }); });
  root.querySelectorAll("[data-zustand]").forEach(function(el){ el.addEventListener("click", function(){ var v=el.getAttribute("data-zustand"); state.filterZustand = state.filterZustand===v?null:v; render(); }); });

  var searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", function(){
      state.query = searchInput.value; render();
      var again = document.getElementById("searchInput");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }
  root.querySelectorAll("[data-pill]").forEach(function(el){
    el.addEventListener("click", function(){
      var group = el.getAttribute("data-pill");
      root.querySelectorAll('[data-pill="'+group+'"]').forEach(function(p){ p.classList.remove("active"); });
      el.classList.add("active");
    });
  });
  root.querySelectorAll(".starbtn").forEach(function(el){
    el.addEventListener("click", function(){
      var group = el.closest(".starsrow");
      var val = parseInt(el.getAttribute("data-star"),10);
      var cur = parseInt(group.getAttribute("data-current"),10) || 0;
      var next = (cur === val) ? 0 : val;
      group.setAttribute("data-current", String(next));
      group.querySelectorAll(".starbtn").forEach(function(s){
        var sv = parseInt(s.getAttribute("data-star"),10);
        s.textContent = sv <= next ? "★" : "☆";
      });
    });
  });

  /* capture flow (available both when adding a new book and when editing one) */
  var btnCapturePhoto = document.getElementById("btnCapturePhoto");
  var capturePhoto = document.getElementById("capturePhoto");
  if(btnCapturePhoto && capturePhoto){
    btnCapturePhoto.addEventListener("click", function(){ capturePhoto.click(); });
    capturePhoto.addEventListener("change", function(){
      var file = capturePhoto.files && capturePhoto.files[0];
      if(!file) return;
      fileToCompressedBase64(file, 900).then(function(b64){
        state.addFlow = Object.assign({}, state.addFlow || BLANK_BOOK, { coverBase64: b64, coverExt: ".jpg" });
        showToast("Foto übernommen.");
        render();
      }).catch(function(){ showToast("Foto konnte nicht verarbeitet werden."); });
    });
  }
  var btnStartScan = document.getElementById("btnStartScan");
  var scanPhoto = document.getElementById("scanPhoto");
  if(btnStartScan && scanPhoto){
    btnStartScan.addEventListener("click", function(){ scanPhoto.click(); });
    scanPhoto.addEventListener("change", function(){
      var file = scanPhoto.files && scanPhoto.files[0];
      scanPhoto.value = "";
      if(!file) return;
      state.scanBusy = true; render();
      decodeBarcodeFromFile(file).then(function(text){
        state.scanBusy = false;
        var isbn = String(text).replace(/[^0-9Xx]/g,"");
        state.addFlow = Object.assign({}, state.addFlow || BLANK_BOOK, { isbn: isbn });
        showToast("ISBN erkannt: " + isbn + " – suche bei Google Books…");
        render();
        bookLookupByIsbn(isbn).then(function(res){
          var cur = state.addFlow || BLANK_BOOK;
          var patch = { isbn: isbn };
          if(!cur.titel) patch.titel = res.titel;
          if(!cur.autor) patch.autor = res.autor;
          if(!cur.verlag) patch.verlag = res.verlag;
          if(!cur.jahr) patch.jahr = res.jahr;
          if(!cur.seiten) patch.seiten = res.seiten;
          state.addFlow = Object.assign({}, cur, patch);
          if(res.coverURL && !hasCover(state.addFlow)){
            urlToBase64(res.coverURL).then(function(b64){
              state.addFlow = Object.assign({}, state.addFlow, { coverBase64: b64, coverExt: ".jpg" });
              showToast("Buch gefunden: " + res.titel);
              render();
            }).catch(function(){ showToast("Buch gefunden: " + res.titel); render(); });
          } else {
            showToast("Buch gefunden: " + res.titel);
            render();
          }
        }).catch(function(err){
          showToast("ISBN erkannt (" + isbn + "), aber kein Treffer bei Google Books: " + err.message);
        });
      }).catch(function(err){
        state.scanBusy = false;
        showToast(err.message);
        render();
      });
    });
  }

  var btnMatch = document.getElementById("btnMatch");
  if(btnMatch){
    btnMatch.addEventListener("click", function(){
      var titel = document.getElementById("f_titel").value.trim();
      if(!titel){ showToast("Bitte zuerst einen Titel eingeben."); return; }
      var autorFld = document.getElementById("f_autor");
      var autor = autorFld ? autorFld.value.trim() : "";
      state.addFlow = Object.assign({}, state.addFlow || BLANK_BOOK, { titel: titel });
      state.matchBusy = true; state.matchResult = null; render();
      bookLookupByTitle(titel, autor).then(function(res){
        if(!res.coverURL){ state.matchBusy = false; state.matchResult = res; render(); return; }
        return urlToBase64(res.coverURL).then(function(b64){
          res.coverBase64 = b64;
          state.matchBusy = false; state.matchResult = res; render();
        }).catch(function(){ state.matchBusy = false; state.matchResult = res; render(); });
      }).catch(function(err){
        state.matchBusy = false; state.matchResult = { error: err.message }; render();
      });
    });
  }
  var btnUseMatch = document.getElementById("btnUseMatch");
  if(btnUseMatch){
    btnUseMatch.addEventListener("click", function(){
      var m = state.matchResult || {};
      var patch = { autor: m.autor||"", verlag: m.verlag||"", jahr: m.jahr||"", isbn: m.isbn||"", seiten: m.seiten||"" };
      if(m.coverBase64 && !hasCover(state.addFlow)){ patch.coverBase64 = m.coverBase64; patch.coverExt = ".jpg"; }
      state.addFlow = Object.assign({}, state.addFlow || BLANK_BOOK, patch);
      showToast("Übernommen.");
      render();
    });
  }
  var btnSave = document.getElementById("btnSave");
  if(btnSave){
    btnSave.addEventListener("click", function(){
      var titel = document.getElementById("f_titel").value.trim();
      if(!titel){ showToast("Bitte einen Titel eingeben."); return; }
      var isNew = state.editing === null;
      var existingIdx = findIndex(isNew ? titel : state.editing);
      var base = Object.assign({}, state.addFlow || BLANK_BOOK);

      base.titel = titel;
      base.autor = document.getElementById("f_autor").value;
      base.verlag = document.getElementById("f_verlag").value;
      base.jahr = document.getElementById("f_jahr").value;
      base.seiten = document.getElementById("f_seiten").value;
      base.isbn = document.getElementById("f_isbn").value;
      base.genre = document.getElementById("f_genre").value;
      base.sprache = document.getElementById("f_sprache").value;
      base.notizen = document.getElementById("f_notizen").value;
      base.gelesen = document.getElementById("f_gelesen").checked ? "Ja" : "Nein";
      var starsGroup = root.querySelector(".starsrow");
      base.bewertung = starsGroup ? starsGroup.getAttribute("data-current") : "0";
      var zPicked = root.querySelector('[data-pill="zustand"].active');
      if(zPicked) base.zustand = zPicked.getAttribute("data-val");
      var aPicked = root.querySelector('[data-pill="ausgabe"].active');
      if(aPicked) base.ausgabe = aPicked.getAttribute("data-val");

      if(isNew){
        if(findIndex(titel) >= 0){ showToast("Ein Buch mit diesem Titel existiert bereits."); return; }
        state.books.push(base);
      } else if(existingIdx>=0){
        state.books[existingIdx] = base;
      }
      persistBooks();
      state.addFlow = null; state.matchResult = null;
      go("regal");
      showToast(isNew ? "Hinzugefügt." : "Gespeichert.");
    });
  }

  /* CSV file export/import (manual fallback) */
  var btnExport = document.getElementById("btnExport");
  if(btnExport){
    btnExport.addEventListener("click", function(){
      var csv = toCSV(state.books);
      var blob = new Blob([csv], {type:"text/csv"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "buecher_export.csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      showToast("CSV exportiert.");
    });
  }
  var btnImport = document.getElementById("btnImport");
  var filePick = document.getElementById("filePick");
  if(btnImport && filePick){
    btnImport.addEventListener("click", function(){ filePick.click(); });
    filePick.addEventListener("change", function(){
      var file = filePick.files && filePick.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try{ parsed = parseCSV(String(reader.result)); }catch(e){ parsed = []; }
        if(!parsed.length){ showToast("Datei konnte nicht gelesen werden."); return; }
        state.confirm = { title:"Bestand ersetzen?", msg:"Die Datei enthält "+parsed.length+" Bücher und ersetzt die aktuell "+state.books.length+" Bücher auf diesem Handy.", okLabel:"Importieren",
          onOk:function(){ state.books = parsed; persistBooks(); var m=loadMeta(); m.lastPull=Date.now(); saveMeta(m); go("regal"); showToast("Import abgeschlossen: "+parsed.length+" Bücher."); } };
        render();
      };
      reader.readAsText(file, "utf-8");
      filePick.value = "";
    });
  }

  /* Settings backup/restore (Nextcloud/Google Drive credentials) */
  var btnExportSettings = document.getElementById("btnExportSettings");
  if(btnExportSettings){
    btnExportSettings.addEventListener("click", function(){
      var gd = loadGDrive();
      var backup = {
        type: "buecher-settings-backup", version: 1, exportedAt: new Date().toISOString(),
        nextcloud: loadNC(),
        gdrive: { clientId: gd.clientId||"", fileId: gd.fileId||"" }
      };
      var blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "buecher-einstellungen.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      showToast("Einstellungen gesichert.");
    });
  }
  var btnImportSettings = document.getElementById("btnImportSettings");
  var filePickSettings = document.getElementById("filePickSettings");
  if(btnImportSettings && filePickSettings){
    btnImportSettings.addEventListener("click", function(){ filePickSettings.click(); });
    filePickSettings.addEventListener("change", function(){
      var file = filePickSettings.files && filePickSettings.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var data;
        try{ data = JSON.parse(String(reader.result)); }catch(e){ data = null; }
        if(!data || data.type !== "buecher-settings-backup"){ showToast("Keine gültige Einstellungen-Sicherung."); return; }
        state.confirm = { title:"Einstellungen wiederherstellen?", msg:"Überschreibt Nextcloud-/Google-Drive-Zugangsdaten auf diesem Gerät mit dem Stand aus der Sicherung.", okLabel:"Wiederherstellen",
          onOk:function(){
            if(data.nextcloud) saveNC(data.nextcloud);
            if(data.gdrive) saveGDrive({ clientId: data.gdrive.clientId||"", fileId: data.gdrive.fileId||"" });
            showToast("Einstellungen wiederhergestellt.");
            go("more");
          } };
        render();
      };
      reader.readAsText(file, "utf-8");
      filePickSettings.value = "";
    });
  }

  /* nextcloud settings */
  var ncTogglePass = document.getElementById("ncTogglePass");
  if(ncTogglePass){
    ncTogglePass.addEventListener("click", function(){
      var f = document.getElementById("nc_pass");
      f.type = f.type === "password" ? "text" : "password";
    });
  }
  var ncSave = document.getElementById("ncSave");
  if(ncSave){
    ncSave.addEventListener("click", function(){
      var nc = { url: document.getElementById("nc_url").value.trim(), user: document.getElementById("nc_user").value.trim(), pass: document.getElementById("nc_pass").value.trim() };
      saveNC(nc);
      showToast("Gespeichert.");
      render();
      if(nc.url) pullFromNextcloud(true);
    });
  }
  var ncPullNow = document.getElementById("ncPullNow");
  if(ncPullNow){
    ncPullNow.addEventListener("click", function(){
      showToast("Rufe ab…");
      pullFromNextcloud(false);
    });
  }
  var ncPushNow = document.getElementById("ncPushNow");
  if(ncPushNow){
    ncPushNow.addEventListener("click", function(){
      showToast("Lade hoch…");
      pushToNextcloud().then(function(){ showToast("Hochgeladen."); render(); })
        .catch(function(err){ showToast("Hochladen fehlgeschlagen: " + err.message); });
    });
  }

  /* Google Drive */
  var gdSaveId = document.getElementById("gdSaveId");
  if(gdSaveId){
    gdSaveId.addEventListener("click", function(){
      var gd = loadGDrive();
      gd.clientId = document.getElementById("gd_clientid").value.trim();
      saveGDrive(gd);
      showToast("Client-ID gespeichert.");
    });
  }
  var gdConnect = document.getElementById("gdConnect");
  if(gdConnect){
    gdConnect.addEventListener("click", function(){
      /* requestAccessToken() opens a popup and must stay inside this
         click handler's call stack - no render()/await before it. */
      var gd = loadGDrive();
      gd.clientId = document.getElementById("gd_clientid").value.trim();
      saveGDrive(gd);
      gdriveConnect().then(function(){
        showToast("Mit Google verbunden.");
        render();
      }).catch(function(err){ showToast(err.message); });
    });
  }
  var gdCreateFile = document.getElementById("gdCreateFile");
  if(gdCreateFile){
    gdCreateFile.addEventListener("click", function(){
      showToast("Lege Datei an…");
      gdriveCreateFile().then(function(){
        showToast("Datei auf Google Drive angelegt und verknüpft.");
        render();
      }).catch(function(err){ showToast("Fehlgeschlagen: " + err.message); });
    });
  }
  var gdUseFileId = document.getElementById("gdUseFileId");
  if(gdUseFileId){
    gdUseFileId.addEventListener("click", function(){
      var id = document.getElementById("gd_fileid").value.trim();
      if(!id){ showToast("Bitte eine Datei-ID eintragen."); return; }
      var gd = loadGDrive(); gd.fileId = id; saveGDrive(gd);
      showToast("Verknüpft.");
      render();
    });
  }
  var gdPullNow = document.getElementById("gdPullNow");
  if(gdPullNow){
    gdPullNow.addEventListener("click", function(){
      showToast("Rufe ab…");
      pullFromGDrive(false);
    });
  }
  var gdPushNow = document.getElementById("gdPushNow");
  if(gdPushNow){
    gdPushNow.addEventListener("click", function(){
      showToast("Lade hoch…");
      pushToGDrive().then(function(){ showToast("Hochgeladen."); render(); })
        .catch(function(err){ showToast("Hochladen fehlgeschlagen: " + err.message); });
    });
  }
}

/* ---------------- boot ---------------- */
render();
loadBooksAsync().then(function(books){
  state.books = books;
  state.booksLoaded = true;
  render();
  var __nc0 = loadNC();
  if(__nc0.url){ setTimeout(function(){ pullFromNextcloud(true); }, 800); }
});
})();
</script>
</body>
</html>
